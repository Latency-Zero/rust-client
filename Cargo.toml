[package]
name = "latzero"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Async Rust client for latzero-server"
license = "MIT"
readme = "README.md"
documentation = "https://docs.rs/latzero"
keywords = ["latzero", "ipc", "rpc", "cache", "async"]
categories = ["asynchronous", "network-programming"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
